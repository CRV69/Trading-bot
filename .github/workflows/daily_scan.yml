name: Radar Diario de Trading

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM UTC (09:00 hora española)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Permite lanzarlo manualmente desde la web de GitHub cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Bot de Análisis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py